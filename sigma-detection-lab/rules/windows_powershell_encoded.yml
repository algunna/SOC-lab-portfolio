title: Windows PowerShell Encoded Command
id: eae2b670-c2d8-4e97-92b6-16e1222d8048
status: experimental
description: Detects encoded PowerShell command-line usage for investigation
logsource:
  product: windows
  category: process_creation
detection:
  selection_image:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_command:
    CommandLine|contains:
      - '-EncodedCommand'
      - '-enc '
  condition: selection_image and selection_command
fields:
  - Image
  - CommandLine
  - ParentImage
  - User
falsepositives:
  - Authorized administrative automation
level: medium
tags:
  - attack.execution
  - attack.t1059.001
