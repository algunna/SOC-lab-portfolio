title: Windows PowerShell Encoded Command
id: eae2b670-c2d8-4e97-92b6-16e1222d8048
status: experimental
description: Detects encoded PowerShell command-line usage for investigation
logsource:
  product: windows
  category: process_creation
detection:
  selection_image:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_command:
    # -EncodedCommand or any abbreviation PowerShell accepts (-e, -ec, -en, -enc, ...),
    # with -, / or en/em-dash prefixes
    CommandLine|re: '(?i)(^|\s)[-/\u2013\u2014\u2015](ec|e|en|enc|enco|encod|encode|encoded|encodedc|encodedco|encodedcom|encodedcomm|encodedcomma|encodedcomman|encodedcommand)(\s|$)'
  condition: selection_image and selection_command
fields:
  - Image
  - CommandLine
  - ParentImage
  - User
falsepositives:
  - Authorized administrative automation
level: medium
tags:
  - attack.execution
  - attack.t1059.001
