name: CloudTrail Threat Hunting Lab
on:
  pull_request:
    paths:
      - 'aws-cloudtrail-threat-hunting/**'
      - '.github/workflows/cloudtrail-threat-hunting.yml'
  push:
    branches: [main]
    paths:
      - 'aws-cloudtrail-threat-hunting/**'
      - '.github/workflows/cloudtrail-threat-hunting.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s aws-cloudtrail-threat-hunting/tests -v
      - name: Verify sample report
        run: |
          python aws-cloudtrail-threat-hunting/src/hunt.py --output /tmp/cloudtrail_hunt.json
          python -c "import json; x=json.load(open('/tmp/cloudtrail_hunt.json')); assert x['count']==4, x"
