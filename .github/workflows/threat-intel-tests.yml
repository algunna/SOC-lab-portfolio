name: Threat intel IOC classification tests
on:
  pull_request:
    paths:
      - 'threat-intel-enrichment-lab/**'
      - '.github/workflows/threat-intel-tests.yml'
  push:
    branches: [main]
    paths:
      - 'threat-intel-enrichment-lab/**'
      - '.github/workflows/threat-intel-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -s threat-intel-enrichment-lab/tests -v
      - name: Run sample workflow
        run: |
          python threat-intel-enrichment-lab/scripts/threat_intel_enrichment.py --output /tmp/ioc_report.md
          grep -q '| 8.8.8.8 | IP address | Not assessed | Unknown |' /tmp/ioc_report.md
