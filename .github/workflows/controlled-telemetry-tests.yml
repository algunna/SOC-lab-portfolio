name: Controlled synthetic telemetry source identity tests
on:
  pull_request:
    paths:
      - 'controlled-telemetry-lab/**'
      - 'soc-event-contract/**'
      - '.github/workflows/controlled-telemetry-tests.yml'
  push:
    branches: [main]
    paths:
      - 'controlled-telemetry-lab/**'
      - 'soc-event-contract/**'
      - '.github/workflows/controlled-telemetry-tests.yml'
permissions:
  contents: read
jobs:
  source-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install contract validator
        run: python -m pip install -r soc-event-contract/requirements.txt
      - name: Test controlled source preflight and event contract
        run: |
          python -m unittest discover -s controlled-telemetry-lab/tests -v
          python -m unittest discover -s soc-event-contract/tests -v
      - name: Verify opaque synthetic source summary
        run: |
          set -euo pipefail
          python controlled-telemetry-lab/src/source_identity.py --out /tmp/scoped-source-summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          raw=Path('/tmp/scoped-source-summary.json').read_text()
          report=json.loads(raw)
          assert report['scope']=='unauthenticated_synthetic_only'
          assert report['live_provenance_verified'] is False
          assert len(report['records']) == 6
          assert report['clock_counts']=={'within_lab_window':4,'delayed_arrival':1,'future_event_time':1}
          assert len({(r['source']['system'],r['source']['record_id']) for r in report['records']})==6
          assert not any(x in raw for x in ('LAB-WS01','123456789012','log_epoch','_raw'))
          PY
      - name: End-to-end synthetic observations through sealed SOC Command Center
        run: |
          set -euo pipefail
          python controlled-telemetry-lab/src/to_soc_alerts.py --out /tmp/synthetic-scoped-alerts.jsonl
          python soc-event-ingestion/src/batch_health.py /tmp/synthetic-scoped-alerts.jsonl --out-dir /tmp/synthetic-source-handoff-batch
          python soc-command-center/src/adapter.py --batch-dir /tmp/synthetic-source-handoff-batch --out /tmp/synthetic-source-dashboard.json
          python - <<'PY'
          import json
          from pathlib import Path
          alerts=[json.loads(x) for x in Path('/tmp/synthetic-scoped-alerts.jsonl').read_text().splitlines()]
          report=json.loads(Path('/tmp/synthetic-source-dashboard.json').read_text())
          health=json.loads(Path('/tmp/synthetic-source-handoff-batch/health.json').read_text())
          assert len(alerts)==len(report['alerts'])==6
          assert health['status']=='passed' and health['counts']['rejected']==0
          assert health['counts']['accepted']==6 and health['counts']['candidates']==6
          assert len(report['candidates'])==6 and report['cases']==[]
          assert all(c['classification']=='unverified' and c['highest_severity']=='informational'
                     for c in report['candidates'])
          assert all(a['rule_id']=='lab.synthetic.source_observation' and
                     a['evidence'][0]['reference'].startswith('synthetic-source:') for a in alerts)
          assert not any(k in a for a in alerts for k in ('actor','asset','attack_techniques'))
          PY
      - name: Reject source identity forgery before downstream files
        run: |
          set -euo pipefail
          python - <<'PY'
          import importlib.util,json
          from pathlib import Path
          p=Path('controlled-telemetry-lab/src/to_soc_alerts.py')
          s=importlib.util.spec_from_file_location('handoff_negative_ci',p)
          m=importlib.util.module_from_spec(s)
          s.loader.exec_module(m)
          fixture=json.loads(Path('controlled-telemetry-lab/fixtures/synthetic_sources.json').read_text())
          fixture['records'][0]['namespace'].pop('log_epoch')
          try:
              m.build(json.dumps(fixture).encode())
          except ValueError:
              pass
          else:
              raise AssertionError('Missing source generation accepted')
          projected=m.source_identity.project(json.loads(
              Path('controlled-telemetry-lab/fixtures/synthetic_sources.json').read_text())['records'][0])
          projected['evidence_reference']='synthetic-source:'+'0'*48
          try:
              m.observation_alert(projected)
          except ValueError:
              pass
          else:
              raise AssertionError('Forged source evidence accepted')
          PY
