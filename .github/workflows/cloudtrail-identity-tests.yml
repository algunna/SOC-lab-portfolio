name: CloudTrail identity correlation
on:
  pull_request:
    paths:
      - 'aws-cloudtrail-threat-hunting/**'
      - '.github/workflows/cloudtrail-identity-tests.yml'
  push:
    branches: [main]
    paths:
      - 'aws-cloudtrail-threat-hunting/**'
      - '.github/workflows/cloudtrail-identity-tests.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s aws-cloudtrail-threat-hunting/tests -v
      - run: |
          python aws-cloudtrail-threat-hunting/src/account_triage.py --output /tmp/account_cases.json --markdown /tmp/account_cases.md
          python -c "import json; assert len(json.load(open('/tmp/account_cases.json')))==1"
          test -s /tmp/account_cases.md
