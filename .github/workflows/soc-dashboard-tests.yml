name: Read-only SOC dashboard tests
on:
  pull_request:
    paths:
      - 'soc-command-center/**'
      - 'soc-event-contract/**'
      - '.github/workflows/soc-dashboard-tests.yml'
  push:
    branches: [main]
    paths:
      - 'soc-command-center/**'
      - 'soc-event-contract/**'
      - '.github/workflows/soc-dashboard-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r soc-event-contract/requirements.txt
      - run: python -m unittest discover -s soc-command-center/tests -v
