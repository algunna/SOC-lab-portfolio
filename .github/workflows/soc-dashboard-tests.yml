name: Read-only SOC dashboard tests
on:
  pull_request:
    paths:
      - 'soc-command-center/**'
      - 'soc-event-contract/**'
      - 'soc-event-ingestion/**'
      - '.github/workflows/soc-dashboard-tests.yml'
  push:
    branches: [main]
    paths:
      - 'soc-command-center/**'
      - 'soc-event-contract/**'
      - 'soc-event-ingestion/**'
      - '.github/workflows/soc-dashboard-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r soc-event-contract/requirements.txt
      - run: python -m unittest discover -s soc-command-center/tests -v
      - name: Integrate real synthetic health gate outputs into read-only monitoring
        run: |
          set -euo pipefail
          python soc-event-ingestion/src/batch_health.py soc-event-contract/examples/windows_alert.json --out-dir /tmp/atlas-health-good
          printf '%s\n' '{synthetic malformed JSON' > /tmp/atlas-health-bad-input.jsonl
          if python soc-event-ingestion/src/batch_health.py /tmp/atlas-health-bad-input.jsonl --out-dir /tmp/atlas-health-bad; then
            echo "Malformed synthetic input was incorrectly accepted"
            exit 1
          fi
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          path=Path('soc-command-center/src/health_dashboard.py')
          spec=importlib.util.spec_from_file_location('offline_health_ci', path)
          m=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          reports=m.load_reports([Path('/tmp/atlas-health-good'),Path('/tmp/atlas-health-bad')])
          agg=m.summarize(reports)
          assert (agg['runs'],agg['passed'],agg['blocked'])==(2,1,1)
          assert agg['counts']['accepted']==1 and agg['counts']['rejected']==1
          page=m.render(reports)
          assert '<script' not in page and 'Offline Batch Health' in page
          assert '/tmp/atlas-health' not in page
          assert 'synthetic malformed JSON' not in page
          PY
