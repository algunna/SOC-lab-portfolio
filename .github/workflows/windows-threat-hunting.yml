name: Windows Threat Hunting Lab
on:
  pull_request:
    paths:
      - 'scripts/powershell_flags.py'
      - 'tests/test_powershell_flags.py'
      - 'tests/fixtures/powershell_host_flags.json'
      - 'windows-threat-hunting-lab/**'
      - '.github/workflows/windows-threat-hunting.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/powershell_flags.py'
      - 'tests/test_powershell_flags.py'
      - 'tests/fixtures/powershell_host_flags.json'
      - 'windows-threat-hunting-lab/**'
      - '.github/workflows/windows-threat-hunting.yml'
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run hunt tests
        run: python -m unittest discover -s windows-threat-hunting-lab/tests -v
      - name: Generate report from synthetic events
        run: |
          python windows-threat-hunting-lab/src/hunt.py --output /tmp/windows-hunt.json
          python -c "import json; d=json.load(open('/tmp/windows-hunt.json')); assert d['count']==4, d"
      - name: Compare both PowerShell detectors on quoted flags and command boundaries
        run: python -m unittest discover -s tests -p test_powershell_flags.py -v
