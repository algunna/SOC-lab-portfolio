name: Sigma detection validation
on:
  pull_request:
    paths:
      - 'sigma-detection-lab/**'
      - '.github/workflows/sigma-detection-tests.yml'
  push:
    branches: [main]
    paths:
      - 'sigma-detection-lab/**'
      - '.github/workflows/sigma-detection-tests.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r sigma-detection-lab/requirements.txt
      - run: python sigma-detection-lab/scripts/validate_rules.py
      - run: python -m unittest discover -s sigma-detection-lab/tests -v
