name: Documentation link checks
on:
  pull_request:
    paths:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/**'
      - 'scripts/verify_docs.py'
      - 'tests/test_docs.py'
      - '.github/workflows/docs-check.yml'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/**'
      - 'scripts/verify_docs.py'
      - 'tests/test_docs.py'
      - '.github/workflows/docs-check.yml'
permissions:
  contents: read
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/verify_docs.py
      - run: python -m unittest discover -s tests -p test_docs.py -v
