name: Offline SOC event ingestion tests
on:
  pull_request:
    paths:
      - 'soc-event-ingestion/**'
      - 'soc-event-contract/**'
      - '.github/workflows/soc-ingestion-tests.yml'
  push:
    branches: [main]
    paths:
      - 'soc-event-ingestion/**'
      - 'soc-event-contract/**'
      - '.github/workflows/soc-ingestion-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r soc-event-contract/requirements.txt
      - run: python -m unittest discover -s soc-event-ingestion/tests -v
      - run: python soc-event-ingestion/src/ingest.py soc-event-contract/examples/windows_alert.json --out /tmp/ingested.json
      - run: python -c "import json; r=json.load(open('/tmp/ingested.json')); assert r['counts']=={'accepted':1,'rejected':0,'duplicates':0}"
      - name: Verify state persists across separate offline executions
        run: |
          set -euo pipefail
          python soc-event-ingestion/src/replay_guard.py --ingestion /tmp/ingested.json --state-db /tmp/replay-guard.db --out /tmp/replay-first.json
          python soc-event-ingestion/src/replay_guard.py --ingestion /tmp/ingested.json --state-db /tmp/replay-guard.db --out /tmp/replay-second.json
          python -c "import json; a=json.load(open('/tmp/replay-first.json')); b=json.load(open('/tmp/replay-second.json')); assert a['counts']['accepted']==1 and b['counts']['accepted']==0 and b['replay_guard']['skipped']==1"
          python soc-incident-correlation/src/correlate.py /tmp/replay-first.json --out /tmp/first-candidates.json
          python soc-incident-correlation/src/correlate.py /tmp/replay-second.json --out /tmp/replay-candidates.json
          python -c "import json; a=json.load(open('/tmp/first-candidates.json')); b=json.load(open('/tmp/replay-candidates.json')); assert a['counts']['alerts']==1 and b['counts']['alerts']==0"
      - name: Test isolated healthy batch and quarantined failure
        run: |
          set -euo pipefail
          python soc-event-ingestion/src/batch_health.py soc-event-contract/examples/windows_alert.json --out-dir /tmp/soc-healthy-batch
          python -c "import json; h=json.load(open('/tmp/soc-healthy-batch/health.json')); c=json.load(open('/tmp/soc-healthy-batch/correlation.json')); assert h['status']=='passed' and h['counts']['accepted']==1 and c['counts']['candidates']==1"
          printf '%s\n' '{broken SECRET-SHOULD-NOT-LEAK' > /tmp/soc-bad-input.jsonl
          if python soc-event-ingestion/src/batch_health.py /tmp/soc-bad-input.jsonl --out-dir /tmp/soc-quarantined-batch; then
            echo "Unsafe acceptance of malformed batch"
            exit 1
          fi
          python -c "import json,pathlib; p=pathlib.Path('/tmp/soc-quarantined-batch'); h=json.loads((p/'health.json').read_text()); q=(p/'quarantine.json').read_text(); assert h['status']=='blocked' and h['stage']=='ingestion'; assert not (p/'ingestion.json').exists() and not (p/'correlation.json').exists(); assert 'SECRET-SHOULD-NOT-LEAK' not in q"
          cp soc-event-contract/examples/windows_alert.json /tmp/soc-bad-input.json
          python soc-event-ingestion/src/batch_health.py /tmp/soc-bad-input.json --out-dir /tmp/soc-manual-recovery
          python -c "import json; assert json.load(open('/tmp/soc-manual-recovery/health.json'))['status']=='passed'; assert json.load(open('/tmp/soc-quarantined-batch/health.json'))['status']=='blocked'"
