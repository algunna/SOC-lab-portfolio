name: Offline SOC event ingestion tests
on:
  pull_request:
    paths:
      - 'soc-event-ingestion/**'
      - 'soc-event-contract/**'
      - '.github/workflows/soc-ingestion-tests.yml'
  push:
    branches: [main]
    paths:
      - 'soc-event-ingestion/**'
      - 'soc-event-contract/**'
      - '.github/workflows/soc-ingestion-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r soc-event-contract/requirements.txt
      - run: python -m unittest discover -s soc-event-ingestion/tests -v
      - run: python soc-event-ingestion/src/ingest.py soc-event-contract/examples/windows_alert.json --out /tmp/ingested.json
      - run: python -c "import json; r=json.load(open('/tmp/ingested.json')); assert r['counts']=={'accepted':1,'rejected':0,'duplicates':0}"
      - name: Verify state persists across separate offline executions
        run: |
          set -euo pipefail
          python soc-event-ingestion/src/replay_guard.py --ingestion /tmp/ingested.json --state-db /tmp/replay-guard.db --out /tmp/replay-first.json
          python soc-event-ingestion/src/replay_guard.py --ingestion /tmp/ingested.json --state-db /tmp/replay-guard.db --out /tmp/replay-second.json
          python -c "import json; a=json.load(open('/tmp/replay-first.json')); b=json.load(open('/tmp/replay-second.json')); assert a['counts']['accepted']==1 and b['counts']['accepted']==0 and b['replay_guard']['skipped']==1"
          python soc-incident-correlation/src/correlate.py /tmp/replay-first.json --out /tmp/first-candidates.json
          python soc-incident-correlation/src/correlate.py /tmp/replay-second.json --out /tmp/replay-candidates.json
          python -c "import json; a=json.load(open('/tmp/first-candidates.json')); b=json.load(open('/tmp/replay-candidates.json')); assert a['counts']['alerts']==1 and b['counts']['alerts']==0"
