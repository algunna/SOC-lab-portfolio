name: Offline SOC event ingestion tests
on:
  pull_request:
    paths:
      - 'soc-event-ingestion/**'
      - 'soc-event-contract/**'
      - '.github/workflows/soc-ingestion-tests.yml'
  push:
    branches: [main]
    paths:
      - 'soc-event-ingestion/**'
      - 'soc-event-contract/**'
      - '.github/workflows/soc-ingestion-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r soc-event-contract/requirements.txt
      - run: python -m unittest discover -s soc-event-ingestion/tests -v
      - run: python soc-event-ingestion/src/ingest.py soc-event-contract/examples/windows_alert.json --out /tmp/ingested.json
      - run: python -c "import json; r=json.load(open('/tmp/ingested.json')); assert r['counts']=={'accepted':1,'rejected':0}"
