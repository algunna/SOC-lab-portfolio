name: SOC event contract tests
on:
  pull_request:
    paths:
      - 'soc-event-contract/**'
      - '.github/workflows/soc-event-contract.yml'
  push:
    branches: [main]
    paths:
      - 'soc-event-contract/**'
      - '.github/workflows/soc-event-contract.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r soc-event-contract/requirements.txt
      - run: python soc-event-contract/src/validate.py soc-event-contract/examples/windows_alert.json
      - run: python -m unittest discover -s soc-event-contract/tests -v
